# Nightly snapshot of the production D1 database (site content) committed to
# git, so staff edits made in the /admin portal get point-in-time history.
#
# Photos are intentionally NOT backed up here: they live in R2, and the SQL
# only references them by key/URL. Restoring this snapshot never deletes or
# replaces R2 objects.
#
# One-time setup: add a repo secret CLOUDFLARE_API_TOKEN with a token that has
# D1 write permission (Account > Workers D1 > Edit). Create one at
# https://dash.cloudflare.com/profile/api-tokens
#
# Manual run: Actions → "D1 content backup" → Run workflow.
# Restore: see README "Backing up site content".

name: D1 content backup

on:
  schedule:
    - cron: "30 18 * * *" # 18:30 UTC daily (01:00 Myanmar time)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (for wrangler)
        run: npm install --no-save wrangler --no-audit --no-fund

      - name: Export production D1
        id: export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          OUT="backups/d1-${STAMP}.sql"
          mkdir -p backups
          npx wrangler d1 export hope-db --remote --output "$OUT"
          cp "$OUT" backups/latest.sql
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Commit snapshot (only when content changed)
        id: commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "d1-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No content changes since the last snapshot — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(backup): D1 content snapshot $(date -u +%Y-%m-%d)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push snapshot
        if: steps.commit.outputs.changed == 'true'
        run: git push origin main
